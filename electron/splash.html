<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Live Streamer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    .splash-card {
      width: 440px;
      padding: 32px 28px;
      background: linear-gradient(145deg, #0f172a, #030712);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 40px rgba(59, 130, 246, 0.15);
      text-align: center;
      color: #ffffff;
      position: relative;
      -webkit-app-region: drag;
    }
    .icon-container {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(37, 99, 235, 0.5);
      animation: pulse 2s infinite ease-in-out;
    }
    .icon-container svg {
      width: 32px;
      height: 32px;
      fill: #ffffff;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(to right, #60a5fa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 12px;
      position: relative;
    }
    .progress-bar {
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      border-radius: 999px;
      animation: indeterminate 1.6s infinite ease-in-out;
    }
    .status-text {
      font-size: 12px;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(148, 163, 184, 0.3);
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes indeterminate {
      0% { transform: translateX(-100%); width: 30%; }
      50% { transform: translateX(100%); width: 60%; }
      100% { transform: translateX(300%); width: 30%; }
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="icon-container">
      <svg viewBox="0 0 24 24">
        <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
      </svg>
    </div>
    <h1>Facebook Live Streamer</h1>
    <p class="subtitle">24/7 Automated Broadcasting Engine</p>
    <div class="progress-bar-container">
      <div class="progress-bar"></div>
    </div>
    <div class="status-text">
      <div class="spinner"></div>
      <span id="status-label">Starting local streaming engine...</span>
    </div>
  </div>
  <script>
    const labels = [
      'Starting local streaming engine...',
      'Initializing offline database...',
      'Configuring FFmpeg encoder...',
      'Launching Live Dashboard...'
    ];
    let i = 0;
    setInterval(() => {
      i = (i + 1) % labels.length;
      document.getElementById('status-label').textContent = labels[i];
    }, 1200);
  </script>
</body>
</html>
